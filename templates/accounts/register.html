{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto my-8">
    <div class="glass-panel rounded-3xl p-8 border border-borderGlass shadow-2xl">
        <div class="text-center mb-8">
            <i class="ri-user-add-line text-neonGreen text-4xl neon-text-glow"></i>
            <h2 class="text-2xl font-bold font-outfit text-white mt-4">Create Corporate Account</h2>
            <p class="text-sm text-gray-400">Join the sha_Tea B2B Wholesale Marketplace</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-300 mb-2">Username</label>
                    <input type="text" name="username" id="username" required 
                           class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                           placeholder="username">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">Corporate Email</label>
                    <input type="email" name="email" id="email" required 
                           class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                           placeholder="email@company.com">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                    <input type="password" name="password" id="password" required 
                           class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                           placeholder="••••••••">
                </div>

                <div>
                    <label for="role" class="block text-sm font-semibold text-gray-300 mb-2">Account Role</label>
                    <select name="role" id="role" 
                            class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none">
                        <option value="BUYER" selected>Buyer (Cafe / Wholesale Brand)</option>
                        <option value="VENDOR">Vendor (Tea Garden Owner)</option>
                        <option value="DISTRIBUTOR">Distributor / Warehouse Partner</option>
                        <option value="DELIVERY">Delivery Partner / Courier</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="company_name" class="block text-sm font-semibold text-gray-300 mb-2">Company Name</label>
                    <input type="text" name="company_name" id="company_name" 
                           class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                           placeholder="e.g. Imperial Cafes Ltd.">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-semibold text-gray-300 mb-2">Phone Number</label>
                    <input type="text" name="phone" id="phone" 
                           class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                           placeholder="+1 (555) 0199">
                </div>
            </div>

            <div>
                <label for="address" class="block text-sm font-semibold text-gray-300 mb-2">Business Address</label>
                <textarea name="address" id="address" rows="3" 
                          class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                          placeholder="Full delivery or plantation address..."></textarea>
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-neonGreen hover:bg-emerald-500 text-black font-extrabold rounded-xl transition-all shadow-[0_0_15px_rgba(57,255,20,0.3)]">
                Register Account
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6 text-sm text-gray-400">
            Already have an account? 
            <a href="{% url 'accounts:login' %}" class="text-neonGreen hover:underline font-bold">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
