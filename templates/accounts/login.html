{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-panel rounded-3xl p-8 border border-borderGlass shadow-2xl">
        <div class="text-center mb-8">
            <i class="ri-leaf-fill text-neonGreen text-4xl neon-text-glow"></i>
            <h2 class="text-2xl font-bold font-outfit text-white mt-4">Welcome Back</h2>
            <p class="text-sm text-gray-400">Access the sha_Tea B2B Wholesale Portal</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-semibold text-gray-300 mb-2">Username</label>
                <input type="text" name="username" id="id_username" required 
                       class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                       placeholder="e.g. buyer or admin">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                <input type="password" name="password" id="id_password" required 
                       class="w-full px-4 py-3 rounded-xl glass-input text-white focus:outline-none" 
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-neonGreen hover:bg-emerald-500 text-black font-extrabold rounded-xl transition-all shadow-[0_0_15px_rgba(57,255,20,0.3)]">
                Log In
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6 text-sm text-gray-400">
            Don't have a corporate account? 
            <a href="{% url 'accounts:register' %}" class="text-neonGreen hover:underline font-bold">Register here</a>
        </div>
        
        <div class="mt-4 p-4 rounded-xl bg-yellow-950/20 border border-yellow-500/20 text-xs text-yellow-300">
            <strong>Development Accounts:</strong><br>
            • Superuser: <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">admin</code> / <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">admin</code><br>
            • Tea Vendor: <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">vendor</code> / <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">admin</code><br>
            • Buyer / Cafe Chain: <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">buyer</code> / <code class="bg-black/40 px-1 py-0.5 rounded text-white font-mono">admin</code>
        </div>
    </div>
</div>
{% endblock %}
